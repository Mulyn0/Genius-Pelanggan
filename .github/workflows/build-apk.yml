name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons (jika resources/icon.png ada)
        if: ${{ hashFiles('resources/icon.png') != '' }}
        run: npx --yes @capacitor/assets generate --android

      - name: Sync web assets
        run: npx cap sync android

      - name: Pakai kunci tanda tangan tetap
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            printf '%s' "$DEBUG_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android > /dev/null
            echo "Kunci tetap valid dan dipakai."
          else
            echo "Secret belum diisi: APK memakai kunci acak."
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: genius-net-pelanggan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
