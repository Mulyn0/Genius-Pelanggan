name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons
        if: ${{ hashFiles('resources/icon-only.png') != '' }}
        run: npx --yes @capacitor/assets generate --android --assetPath resources --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'

      - name: Sync web assets
        run: npx cap sync android

      - name: Pakai kunci tanda tangan tetap
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 || secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android > /dev/null
            echo "Kunci tetap valid dan dipakai."
          else
            echo "Secret belum diisi: APK memakai kunci acak."
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk genius-net-pelanggan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: genius-net-pelanggan-apk
          path: genius-net-pelanggan.apk

      - name: Publish ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: terbaru
          name: APK Terbaru
          files: genius-net-pelanggan.apk
          make_latest: true
